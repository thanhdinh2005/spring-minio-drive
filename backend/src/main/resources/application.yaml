spring:
  application:
    name: backend

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /api
  tomcat:
    # -1: nuốt hết body thừa khi vượt max-request-size để MaxUploadSizeExceededException trả được 413,
    # thay vì Tomcat abort connection (mặc định 2MB) -> client treo sau "100 Continue"
    max-swallow-size: -1
    connection-timeout: 20s
    keep-alive-timeout: 30s

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

  public-folder-base-url: ${PUBLIC_FOLDER_BASE_URL:http://localhost:8081/api/public/folders}

logging:
  level:
    root: INFO

application:
  security:
    jwt:
      expiration: ${TOKEN_EXP:3600000}
      refresh-expiration-ms: ${REFRESH_EXP:86400000}

storage:
  multipart-threshold: 5242880
  # byte, phải khớp spring.servlet.multipart.max-file-size để validate 413 thay vì lỗi parse multipart
  max-file-size: 10485760
  allowed-mime-types:
    - "application/pdf"
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"
    - "application/msword"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "application/vnd.ms-excel"
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    - "application/vnd.ms-powerpoint"
    - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
    - "application/zip"
    - "application/x-zip-compressed"
    - "text/plain"
    - "text/csv"

name: Module - Docker Retag

on:
  workflow_call:
    inputs:
      git-sha:
        description: Short Git SHA
        required: true
        type: string
      version:
        description: Version tag
        required: true
        type: string

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull, Retag & Push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ inputs.git-sha }}
          VERSION: ${{ inputs.version }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/spring-api"

          echo "Promoting $IMAGE:sha-$GIT_SHA -> $VERSION / latest"

          docker pull "$IMAGE:sha-$GIT_SHA"

          docker tag "$IMAGE:sha-$GIT_SHA" "$IMAGE:$VERSION"
          docker tag "$IMAGE:sha-$GIT_SHA" "$IMAGE:latest"

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

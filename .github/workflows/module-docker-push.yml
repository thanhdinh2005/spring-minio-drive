name: Module - Docker Build & Push

on:
  workflow_call:
    outputs:
      git-sha:
        description: "Short Git SHA"
        value: ${{ jobs.build-and-push.outputs.git-sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      git-sha: ${{ steps.git-sha.outputs.sha }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Get Git SHA
        id: git-sha
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mini-drive-api
          tags: |
            type=raw,value=sha-${{ steps.git-sha.outputs.sha }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mini-drive-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mini-drive-api:buildcache,mode=max
